<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>验证码</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3; padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card { width: 100%; max-width: 460px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; color: #8b949e; letter-spacing: .04em; text-transform: uppercase; }
  .code {
    font-size: clamp(44px, 15vw, 72px); font-weight: 800; letter-spacing: .1em;
    line-height: 1.1; margin: 10px 0 6px; color: #7ee787; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .code.none { font-size: 30px; color: #f0883e; letter-spacing: 0; }
  .meta { font-size: 13px; color: #8b949e; line-height: 1.7; }
  .meta b { color: #c9d1d9; font-weight: 600; }
  .subject { margin-top: 14px; padding-top: 14px; border-top: 1px solid #30363d; font-size: 13px; color: #8b949e; word-break: break-word; }
  .ctx { margin-top: 10px; font-size: 12px; color: #6e7681; background: #0d1117; border-radius: 8px; padding: 10px; word-break: break-word; }
  h2 { font-size: 12px; color: #6e7681; text-transform: uppercase; letter-spacing: .05em; margin: 22px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 9px 0; border-bottom: 1px solid #21262d; font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }
  li:last-child { border-bottom: 0; }
  li .c { color: #7ee787; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
  li .t { color: #6e7681; white-space: nowrap; }
  footer { margin-top: 20px; font-size: 11px; color: #484f58; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <h1>DeepSeek 验证码</h1>
  <div class="code none">未找到验证码</div>
  <div class="meta">
    <div>抓取时间：<b>2026-10-14 22:03:51</b></div>
    <div>邮件时间：<b>—</b></div>
    <div>状态：<b>待命中：等待 2026-10-15 13:35 抓取</b></div>
  </div>
  <div class="subject">发件人：—<br>主题：—</div>
  
  <h2>最近邮件</h2>
  <ul><li><span class="t">暂无 DeepSeek 邮件</span></li></ul>
  <footer>每 60 秒自动刷新 · 页面生成于 2026-10-14 22:03:51</footer>
</div>
<script>setTimeout(function () { location.reload(); }, 60000);</script>
</body>
</html>
